<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus pedidos · Nova Geração</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f3ef;--ink:#1b211f;--muted:#66706b;--line:#e1e4de;--accent:#0f5c4a;
  --NFT:#c8241a;--NFTb:#fbe9e7;--SEP:#b4560c;--SEPb:#fef0e4;--SEPd:#f5862a;--FAT:#7f6200;--FATb:#fdf4d3;--FATd:#e8b400;--AGU:#7d3aa0;--AGUb:#f4eaf9;--AGUd:#9b4fc0;--ACE:#1f6fd1;--ACEb:#e6f0fc;--ENT:#0f8a3c;--ENTb:#e2f3e8;--DEV:#111111;--DEVb:#e9e9e9;--RE:#8e1f4c;--REb:#f6e6ec}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "IBM Plex Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%}
header{background:var(--accent);color:#fff;padding:16px 16px 14px}
header .b{font-size:12px;opacity:.8;letter-spacing:.4px;text-transform:uppercase}
header h1{margin:3px 0 2px;font-size:21px;font-weight:600;line-height:1.2}
header .d{font-size:14px;opacity:.9}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.search{width:100%;font:inherit;font-size:16px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;font-weight:500;color:var(--ink)}
.chip b{margin-left:4px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
main{padding:10px 12px 40px;max-width:640px;margin:0 auto}
.sec{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:18px 4px 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.ch{display:flex;gap:12px;padding:14px;align-items:flex-start;cursor:pointer}
.ch .main{flex:1;min-width:0}
.cn{font-weight:600;font-size:16.5px;line-height:1.25}
.cl{font-size:14px;color:var(--muted);margin-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.val{text-align:right;flex:none}
.val .v{font-weight:700;font-size:16px;white-space:nowrap}
.val .ar{color:var(--muted);font-size:13px;margin-top:6px}
.body{border-top:1px solid var(--line);padding:4px 14px 12px;display:none}
.card.open .body{display:block}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;padding:10px 0 6px}
.info .l{font-size:12px;color:var(--muted)}
.info .x{font-weight:600;font-size:15px}
.alert{font-size:14px;border-radius:10px;padding:9px 11px;margin:6px 0}
.alert.re{background:var(--REb);color:var(--RE)}
.alert.dv{background:var(--DEVb);color:var(--DEV)}
.it{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:none}
.it .n{flex:1;min-width:0;font-size:15px;line-height:1.3}
.it .u{font-size:13px;color:var(--muted);margin-top:2px}
.it .dvl{font-size:13px;color:var(--NFT);margin-top:2px;font-weight:500}
.it .t{text-align:right;font-weight:600;white-space:nowrap;font-size:15px}
.it .q{font-size:13px;color:var(--muted);font-weight:400}
.tot{display:flex;justify-content:space-between;padding:12px 0 2px;border-top:2px solid var(--ink);font-weight:700;font-size:16px}
.lg{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 18px;margin:18px 14px;max-width:420px}
@media(min-width:460px){.lg{margin:28px auto}}
.lg h2{margin:0 0 4px;font-size:20px}.lg p{margin:0 0 16px;color:var(--muted);font-size:15px}
.lg label{display:block;font-size:14px;font-weight:600;margin-bottom:14px}
.lg input:not([type=checkbox]){display:block;width:100%;margin-top:6px;font:inherit;font-size:20px;letter-spacing:.5px;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.lg .rm{font-weight:400;display:flex;gap:8px;align-items:center}
.lg .rm input{width:20px;height:20px}
.lg button{width:100%;font:inherit;font-size:17px;font-weight:600;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#fff}
.lg button:disabled{opacity:.6}
.lg .err{color:var(--NFT);font-size:14px;margin-top:12px;min-height:18px}
.out{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:9px;padding:6px 10px;font:inherit;font-size:13px;float:right;margin-top:2px}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:20px}
</style>
</head>
<body>
<header><button class="out hide" id="out">Sair</button><div class="b">Distribuidora Nova Geração</div><h1 id="vn">Meus pedidos</h1><div class="d" id="sub"></div></header>
<div class="bar hide" id="bar">
  <input class="search" id="q" type="search" placeholder="Buscar cliente, cidade ou NF" autocomplete="off">
  <div class="chips" id="chips"></div>
</div>
<main id="main"></main>
<div id="login" class="hide">
  <form class="lg" id="lgForm" autocomplete="on">
    <h2>Consultar meus pedidos</h2>
    <p>Informe seu código de vendedor e o CNPJ da empresa.</p>
    <label>Código do vendedor<input id="lgCode" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="Ex.: 055" required></label>
    <label>CNPJ da empresa<input id="lgCnpj" inputmode="numeric" placeholder="00.000.000/0000-00" maxlength="18" required></label>
    <label class="rm"><input type="checkbox" id="lgRem" checked> Lembrar neste celular</label>
    <button type="submit" id="lgBtn">Ver meus pedidos</button>
    <div class="err" id="lgErr"></div>
  </form>
</div>
<script>
'use strict';
const ST = {
  NFT: ['Aguardando roteirização', 'var(--NFT)', 'var(--NFTb)'],
  AGU: ['Aguardando carregamento', 'var(--AGU)', 'var(--AGUb)'],
  SEP: ['Em separação', 'var(--SEP)', 'var(--SEPb)'],
  ROTA: ['Em rota de entrega', 'var(--FAT)', 'var(--FATb)'],
  ACE: ['Em acerto', 'var(--ACE)', 'var(--ACEb)'],
  ENT: ['Entrega confirmada', 'var(--ENT)', 'var(--ENTb)'],
  DEV: ['Devolvido', 'var(--DEV)', 'var(--DEVb)']
};
ST.FAT = ST.ROTA; ST.DEVP = ST.ENT; // arquivos antigos
const GROUPS = [['NFT', 'Aguardando roteirização', 'Aguard. roteirização', ['NFT']], ['AGU', 'Aguardando carregamento', 'Aguard. carregamento', ['AGU']],
  ['SEP', 'Em separação', 'Em separação', ['SEP']], ['ROTA', 'Em rota de entrega', 'Em rota', ['ROTA', 'FAT']], ['ACE', 'Em acerto', 'Em acerto', ['ACE']],
  ['ENT', 'Entrega confirmada', 'Entrega confirmada', ['ENT', 'DEVP']], ['DEV', 'Devolvido', 'Devolvido', ['DEV']]];
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const brl = (v) => 'R$ ' + (v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const qf = (q) => (q || 0).toLocaleString('pt-BR', { maximumFractionDigits: 3 });
const WD = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const day = (n) => { if (!n) return '—'; const d = new Date(n * 864e5); return String(d.getUTCDate()).padStart(2, '0') + '/' + String(d.getUTCMonth() + 1).padStart(2, '0'); };
const dayW = (n) => n ? WD[(n + 4) % 7] + ' ' + day(n) : '—';
const fmtPed = (n) => { if (!n || !DATA) return day(n); const diff = DATA.D - n; if (diff === 0) return 'Hoje'; if (diff > 0 && diff <= 6) return tc(WD[(n + 4) % 7]); return day(n); };
const tc = (s) => String(s || '').toLowerCase().replace(/(^|[\s/(])\S/g, (x) => x.toUpperCase());
let DATA = null, F = 'all', Q = '';
const tag = (s) => `<span class="tag" style="color:${ST[s][1]};background:${ST[s][2]}">${ST[s][0]}</span>`;

const isW = (d, sg) => { const w = (d + 4) % 7; return w !== 0 && !(sg === 'A' && w === 6); };
const wd = (a, b, sg) => { if (!a || !b || b <= a) return 0; let n = 0; for (let d = a + 1; d <= b; d++) if (isW(d, sg)) n++; return n; };
const addW = (a, n, sg) => { let d = a, k = 0; while (k < n) { d++; if (isW(d, sg)) k++; } return d; };
const du = (n, open) => open ? (n ? `há ${n} dia${n > 1 ? 's' : ''} út${n > 1 ? 'eis' : 'il'}` : 'desde hoje') : (n ? `${n} dia${n > 1 ? 's' : ''} út${n > 1 ? 'eis' : 'il'}` : 'mesmo dia');
function vida(o) {
  const D = DATA.D, sg = o.sg || 'B', S = [];
  const P = (k, t, when, info, f) => S.push(Object.assign({ k, t, when, info }, f || {}));
  P('NFT', 'Pedido digitado', dayW(o.DP), '', { done: 1 });
  if (o.s === 'NFT' || !o.F) { P('NFT', 'Aguardando faturamento', 'agora', 'sem nota fiscal · ' + du(wd(o.DP, D, sg), 1), { cur: 1 }); }
  else {
    P('SEP', 'Faturado (nota emitida)', dayW(o.F), du(wd(o.DP, o.F, sg)) + ' desde o pedido', { done: 1 });
    const se = addW(o.F, 2, sg);
    if (!o.exp && o.s !== 'ENT' && o.s !== 'DEV') {
      if (!o.pg && D < se) P('SEP', 'Em separação', 'agora', du(wd(o.F, D, sg), 1), { cur: 1 });
      else { const since = o.pg ? o.F : se; if (since > o.F) P('SEP', 'Separação', dayW(o.F) + ' → ' + dayW(since), du(wd(o.F, since, sg)), { sub: 1 });
        P('AGU', 'Aguardando carregamento', 'agora', (o.m ? 'Mapa ' + esc(o.m) + ' · ' : '') + du(wd(since, D, sg), 1), { cur: 1 }); }
    } else if (o.exp) {
      if (o.exp > se) { P('SEP', 'Separação', dayW(o.F) + ' → ' + dayW(se), du(wd(o.F, se, sg)), { sub: 1 }); P('AGU', 'Aguardando carregamento', dayW(se) + ' → ' + dayW(o.exp), du(wd(se, o.exp, sg)), { sub: 1 }); }
      else P('SEP', 'Separação', dayW(o.F) + ' → ' + dayW(o.exp), du(wd(o.F, o.exp, sg)), { sub: 1 });
      P('FAT', 'Saiu para entrega', dayW(o.exp), 'Mapa ' + esc(o.m || '—') + (o.tend ? ' · viagem até ' + dayW(o.tend) : ''), { done: 1 });
      if (o.s === 'ROTA' || o.s === 'FAT') P('FAT', 'Em rota de entrega', 'agora', o.tend ? 'viagem termina ' + dayW(o.tend) : '', { cur: 1 });
      if (o.s === 'ACE') P('ACE', 'Em acerto', 'agora', 'viagem terminou ' + dayW(o.tend) + ' · ' + du(wd(o.tend, D, sg), 1) + ' aguardando confirmação', { cur: 1 });
    }
    if (o.s === 'ENT') P('ENT', 'Entrega confirmada', dayW(o.ent), du(wd(o.DP, o.ent, sg)) + ' do pedido até a confirmação', { done: 1 });
    if (o.s === 'DEV') P('DEV', 'Devolvido', dayW(o.dd), esc(tc(o.mot) || 'sem motivo'), { done: 1 });
  }
  const cur = (S.find((x) => x.cur) || {}).k;
  const NX = { NFT: ['Faturamento', 'Saída para entrega', 'Entrega confirmada'], SEP: ['Saída para entrega', 'Entrega confirmada'], AGU: ['Saída para entrega', 'Entrega confirmada'], FAT: ['Entrega confirmada'], ACE: ['Entrega confirmada'] };
  for (const t of NX[cur] || []) P('X', t, '', '', { todo: 1 });
  return `<div class="vt"><div class="vth">Vida do pedido</div><ol>${S.map((x) => `<li class="${x.cur ? 'cur' : ''} ${x.sub ? 'sub' : ''} ${x.todo ? 'todo' : ''}" style="--c:var(--${x.k}d, var(--${x.k}))"><i></i><div class="r"><b>${x.t}</b><span>${x.when}</span></div>${x.info ? `<div class="s">${x.info}</div>` : ''}</li>`).join('')}</ol></div>`;
}
function card(o, i) {
  const tq = o.it.reduce((t, x) => t + x[1], 0);
  const pend = o.s === 'NFT';
  const parado = o.s === 'NFT' || o.s === 'AGU';
  return `<div class="card" data-i="${i}">
    <div class="ch"><div class="main">
      <div class="cn">${esc(tc(o.cn))}</div>
      <div class="cl">${DATA.multi ? '<b>' + esc(o.u) + '</b> · ' : ''}${esc(tc(o.cid))}${o.bai ? ' · ' + esc(tc(o.bai)) : ''}</div>
      <div class="tags">${tag(o.s)}${o.re ? '<span class="tag" style="color:var(--RE);background:var(--REb)">Reentrega</span>' : ''}${o.dias ? `<span class="tag" style="color:var(--NFT);background:#fff;border:1px solid var(--NFTb)">parado ${o.dias}d</span>` : ''}</div>
    </div><div class="val"><div class="v">${brl(o.s === 'DEV' ? o.vd : o.vv)}</div><div class="ar">${o.it.length} itens ▾</div></div></div>
    <div class="body">
      <div class="info">
        <div><div class="l">${pend ? 'Pedido' : 'Nota fiscal'}</div><div class="x">${esc(o.id)}</div></div>
        <div><div class="l">Condição</div><div class="x">${esc(o.to || '—')}</div></div>
        <div><div class="l">Data do pedido</div><div class="x">${fmtPed(o.DP)}</div></div>
        <div><div class="l">Faturamento</div><div class="x">${pend ? 'não faturado' : dayW(o.F)}</div></div>
      </div>
      ${vida(o)}
      ${o.re ? `<div class="alert re"><b>Reentrega</b> · pedido original ${day(o.re.dp)}, devolvido em ${day(o.re.dd)} (${esc(tc(o.re.mot))})</div>` : ''}
      ${o.s === 'DEV' ? `<div class="alert dv"><b>Devolvido</b> em ${day(o.dd)} · ${esc(tc(o.mot) || 'sem motivo')} · ${brl(o.vd)}</div>` : ''}
      ${o.devp ? `<div class="alert dv"><b>Devolução parcial</b> em ${day(o.devp.dd)} · ${esc(tc(o.devp.mot) || 'sem motivo')} · ${brl(o.devp.v)}</div>` : ''}
      ${o.s === 'ENT' && o.ent ? `<div class="alert" style="background:var(--ENTb);color:var(--ENT)">Carga encerrada em ${dayW(o.ent)}</div>` : ''}
      ${o.it.map(([n, q, v, qd, vd]) => `<div class="it"><div class="n">${esc(tc(n))}
          <div class="u">${q ? brl(v / q) + ' cada' : ''}</div>${qd ? `<div class="dvl">Devolvido: ${qf(qd)} · ${brl(vd)}</div>` : ''}</div>
        <div class="t">${brl(v)}<div class="q">${qf(q)} un.</div></div></div>`).join('')}
      <div class="tot"><span>Total · ${qf(tq)} un.</span><span>${brl(o.vv)}</span></div>
    </div></div>`;
}
function render() {
  const os = DATA.o.map((o, i) => [o, i]).filter(([o]) => !Q || (o.cn + ' ' + o.cid + ' ' + o.bai + ' ' + o.id).toUpperCase().includes(Q));
  const cnt = (keys) => os.filter(([o]) => keys.includes(o.s)).length;
  document.getElementById('chips').innerHTML = `<button class="chip ${F === 'all' ? 'on' : ''}" data-f="all">Todos<b>${os.length}</b></button>` +
    GROUPS.map(([k, l, sl, keys]) => cnt(keys) ? `<button class="chip ${F === k ? 'on' : ''}" data-f="${k}">${sl}<b>${cnt(keys)}</b></button>` : '').join('');
  let h = '';
  for (const [k, l, sl, keys] of GROUPS) {
    if (F !== 'all' && F !== k) continue;
    const list = os.filter(([o]) => keys.includes(o.s)).sort((a, b) => (b[0].dias - a[0].dias) || a[0].cn.localeCompare(b[0].cn));
    if (!list.length) continue;
    h += `<div class="sec">${l} · ${list.length}</div>` + list.map(([o, i]) => card(o, i)).join('');
  }
  document.getElementById('main').innerHTML = (h || '<div class="empty">Nenhum pedido encontrado.</div>') +
    `<div class="foot">Posição de ${dayW(DATA.D)} · toque no cliente para ver os itens</div>`;
}
document.getElementById('main').addEventListener('click', (e) => { const h = e.target.closest('.ch'); if (h) h.parentElement.classList.toggle('open'); });
document.getElementById('chips').addEventListener('click', (e) => { const c = e.target.closest('[data-f]'); if (c) { F = c.dataset.f; render(); } });
document.getElementById('q').addEventListener('input', (e) => { Q = e.target.value.trim().toUpperCase(); render(); });
async function sha(txt) { return new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt))); }
const hex = (b) => Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
function fail(msg) { document.getElementById('main').innerHTML = '<div class="empty">' + msg + '</div>'; }
const SALT = 'nova-geracao-pedidos-v2';
const LSK = 'ng.pedidos.login';
const ls = { get() { try { return JSON.parse(localStorage.getItem(LSK) || 'null'); } catch (e) { return null; } }, set(v) { try { v ? localStorage.setItem(LSK, JSON.stringify(v)) : localStorage.removeItem(LSK); } catch (e) {} } };
const show = (id, on) => document.getElementById(id).classList.toggle('hide', !on);
let ALL = null;
async function getAll() { if (ALL) return ALL; const r = await fetch('dados.json?' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw new Error('rede'); ALL = await r.json(); return ALL; }
async function open(cnpj, code) {
  const login = cnpj + '|' + code;
  const all = await getAll();
  const id = hex(await sha('id|' + SALT + '|' + login)).slice(0, 24);
  const blob = all.d[id];
  if (!blob) return null;
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode('chave|' + login), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: new TextEncoder().encode(SALT), iterations: 150000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const raw = Uint8Array.from(atob(blob), (c) => c.charCodeAt(0));
  const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, key, raw.slice(12));
  return JSON.parse(await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
}
const HORA_INI = 8, HORA_FIM = 18;
const TESTE = true; // ← modo teste: libera fora do horário e com posição de outro dia. Trocar para false para ativar o bloqueio.
function agoraSP() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hour12: false }).formatToParts(new Date()).map((x) => [x.type, x.value]));
  return { day: Date.UTC(+p.year, +p.month - 1, +p.day) / 864e5, hour: +p.hour % 24 };
}
function bloqueio(d) {
  if (TESTE) return '';
  const a = agoraSP();
  if (a.hour < HORA_INI || a.hour >= HORA_FIM) return `A consulta fica disponível das ${String(HORA_INI).padStart(2, '0')}:00 às ${HORA_FIM}:00.`;
  if (d.D !== a.day) return 'A posição de hoje ainda não foi publicada. Tente novamente mais tarde.';
  return '';
}
function showData(d) {
  const b = bloqueio(d);
  if (b) { showLogin(b); return; }
  DATA = d;
  document.getElementById('vn').textContent = tc(d.vn);
  document.getElementById('sub').textContent = d.un + ' · posição de ' + dayW(d.D);
  document.title = 'Pedidos · ' + tc(d.vn);
  show('login', false); show('bar', true); show('main', true); show('out', true);
  render();
}
function showLogin(msg) {
  DATA = null;
  document.getElementById('vn').textContent = 'Meus pedidos';
  document.getElementById('sub').textContent = '';
  show('bar', false); show('main', false); show('out', false); show('login', true);
  document.getElementById('lgErr').textContent = msg || '';
}
const digits = (s) => s.replace(/\D/g, '');
document.getElementById('lgCnpj').addEventListener('input', (e) => {
  const d = digits(e.target.value).slice(0, 14);
  e.target.value = d.replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2');
});
document.getElementById('lgForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const code = digits(document.getElementById('lgCode').value).padStart(3, '0').slice(-3);
  const cnpj = digits(document.getElementById('lgCnpj').value);
  if (cnpj.length !== 14) return showLogin('CNPJ incompleto: são 14 números.');
  const btn = document.getElementById('lgBtn'); btn.disabled = true; btn.textContent = 'Abrindo…';
  try {
    const d = await open(cnpj, code);
    if (!d) { showLogin('Não encontramos pedidos para esse código e CNPJ. Confira os dados.'); }
    else { ls.set(document.getElementById('lgRem').checked ? { cnpj, code } : null); showData(d); }
  } catch (err) { showLogin('Não foi possível abrir agora. Verifique a internet e tente de novo.'); }
  btn.disabled = false; btn.textContent = 'Ver meus pedidos';
});
document.getElementById('out').addEventListener('click', () => { ls.set(null); showLogin(''); });
async function start() {
  const s = ls.get();
  if (s) {
    document.getElementById('main').innerHTML = '<div class="empty">Carregando…</div>';
    try { const d = await open(s.cnpj, s.code); if (d) return showData(d); } catch (e) {}
  }
  showLogin('');
}
start();

</script>
